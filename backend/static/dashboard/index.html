<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireVision Admin Dashboard</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Login Overlay -->
        <div id="login-overlay" class="overlay active">
            <div class="glass-card login-card">
                <div class="card-header">
                    <i class="fas fa-fire-extinguisher logo-icon"></i>
                    <h1>FIRE GUARD Admin</h1>
                    <p>Enter your credentials to manage the system</p>
                </div>
                <form id="login-form">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="text" id="email" placeholder="Email or Username" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                    <div id="login-error" class="error-msg"></div>
                </form>
            </div>
        </div>

        <!-- Dashboard Layout (Hidden until login) -->
        <div id="dashboard" class="hidden">
            <aside class="sidebar glass-panel">
                <div class="sidebar-header">
                    <i class="fas fa-fire-extinguisher"></i>
                    <span>FireVision</span>
                </div>
                <nav class="sidebar-nav">
                    <a href="#" class="nav-link active" data-view="users">
                        <i class="fas fa-users"></i> <span>Users</span>
                    </a>
                    <a href="#" class="nav-link" data-view="cameras">
                        <i class="fas fa-video"></i> <span>Cameras</span>
                    </a>
                    <a href="#" class="nav-link" data-view="alerts">
                        <i class="fas fa-bell"></i> <span>Alerts</span>
                    </a>
                </nav>
                <div class="sidebar-footer">
                    <div class="user-info">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=random" id="user-avatar"
                            alt="Avatar">
                        <div class="user-details">
                            <span id="user-name">Administrator</span>
                            <span id="user-role">Super Admin</span>
                        </div>
                    </div>
                    <button id="logout-btn" class="btn btn-icon"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </aside>

            <main class="content">
                <header class="content-header">
                    <h2 id="view-title">User Management</h2>
                    <div class="header-actions">
                        <button id="add-btn" class="btn btn-primary btn-sm">
                            <i class="fas fa-plus"></i> <span id="add-btn-text">Add User</span>
                        </button>
                    </div>
                </header>

                <section id="content-area" class="content-grid">
                    <!-- Dynamic content injected here -->
                </section>
            </main>
        </div>

        <!-- Add/Edit Modal -->
        <div id="modal-overlay" class="overlay">
            <div class="glass-card modal-card">
                <div class="modal-header">
                    <h2 id="modal-title">Add User</h2>
                    <button class="btn-close">&times;</button>
                </div>
                <form id="modal-form">
                    <div id="modal-fields">
                        <!-- Dynamic fields based on view -->
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Status Toast -->
        <div id="toast" class="toast hidden"></div>
    </div>
    <script src="/dashboard/app.js"></script>
</body>

</html>
