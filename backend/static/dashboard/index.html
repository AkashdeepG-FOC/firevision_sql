<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireGuard Admin · Dashboard</title>
    <meta name="description" content="FireGuard Admin Dashboard — Manage users, cameras, and fire alerts.">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<div id="app">

    <!-- ═══════════ LOGIN OVERLAY ═══════════ -->
    <div id="login-overlay" class="overlay active">
        <div class="login-card">
            <div class="card-header">
                <div class="logo-wrap">
                    <i class="fas fa-shield-halved logo-icon"></i>
                </div>
                <h1>FireGuard Admin</h1>
                <p>Sign in to manage your fire detection system</p>
            </div>

            <div class="login-divider"><span>credentials</span></div>

            <form id="login-form" autocomplete="on">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="email" placeholder="Email or Username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <i class="fas fa-arrow-right-to-bracket"></i> Sign In
                </button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- ═══════════ DASHBOARD ═══════════ -->
    <div id="dashboard" class="hidden">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-icon">
                    <i class="fas fa-fire"></i>
                </div>
                <span class="sidebar-brand">Fire<span>Guard</span></span>
            </div>

            <p class="sidebar-section-label">Main Navigation</p>

            <nav class="sidebar-nav">
                <a href="#" class="nav-link active" data-view="users" id="nav-users">
                    <span class="nav-icon"><i class="fas fa-users"></i></span>
                    <span>Users</span>
                </a>
                <a href="#" class="nav-link" data-view="cameras" id="nav-cameras">
                    <span class="nav-icon"><i class="fas fa-video"></i></span>
                    <span>Cameras</span>
                </a>
                <a href="#" class="nav-link" data-view="alerts" id="nav-alerts">
                    <span class="nav-icon"><i class="fas fa-bell"></i></span>
                    <span>Alerts</span>
                    <span class="nav-badge" id="alert-badge" style="display:none">0</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-avatar-wrap">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=E84040&color=fff&bold=true&size=80" id="user-avatar" alt="User Avatar">
                    <span class="avatar-status"></span>
                </div>
                <div class="user-meta">
                    <span class="u-name" id="user-name">Administrator</span>
                    <span class="u-role" id="user-role">Super Admin</span>
                </div>
                <button id="logout-btn" title="Sign out">
                    <i class="fas fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main -->
        <main class="content">
            <header class="content-header">
                <div class="header-left">
                    <span class="page-eyebrow" id="view-eyebrow">Management</span>
                    <h2 id="view-title">User Management</h2>
                </div>
                <div class="header-actions">
                    <div class="header-search">
                        <i class="fas fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search…">
                    </div>
                    <button id="add-btn" class="btn btn-primary btn-sm">
                        <i class="fas fa-plus"></i> <span id="add-btn-text">Add User</span>
                    </button>
                </div>
            </header>

            <!-- Stats row injected here by JS -->
            <div id="stat-bar-wrap" style="padding: 1.5rem 2rem 0;"></div>

            <section id="content-area" class="content-grid" style="padding-top:1.2rem;">
                <!-- Dynamic content injected here -->
            </section>
        </main>
    </div>

    <!-- ═══════════ MODAL ═══════════ -->
    <div id="modal-overlay" class="overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Add User</h2>
                <button class="btn-close" title="Close">&times;</button>
            </div>
            <form id="modal-form">
                <div id="modal-fields">
                    <!-- Dynamic fields injected by JS -->
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary btn-close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="width:auto;margin-top:0;">
                        <i class="fas fa-check"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══════════ TOAST ═══════════ -->
    <div id="toast" class="toast hidden">
        <span class="toast-icon"><i class="fas fa-circle-check"></i></span>
        <span id="toast-msg">Action completed</span>
    </div>

</div>
<script src="/dashboard/app.js"></script>
</body>
</html>
