version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: firevision_db
    restart: always
    environment:
      MYSQL_DATABASE: firevision
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firevision_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+mysqlconnector://root:@db:3306/firevision
      - SECRET_KEY=your_secret_key_change_me_in_production
      - REFRESH_TOKEN_SECRET_KEY=your_refresh_secret_key_change_me_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000
      - RATE_LIMIT_LIMIT=60/minute
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
